<!DOCTYPE html>
<html>
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Ashik Das T.H | Portfolio - Flutter Developer">

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dasthashik.github.io/portfolio_ashik_das_th_2026_may/">
    <meta property="og:title" content="Ashik Das T.H | Portfolio">
    <meta property="og:description" content="Flutter Developer Portfolio - Showcasing mobile and web projects.">
    <meta property="og:image" content="https://dasthashik.github.io/portfolio_ashik_das_th_2026_may/assets/assets/images/primg.jpeg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://dasthashik.github.io/portfolio_ashik_das_th_2026_may/">
    <meta property="twitter:title" content="Ashik Das T.H | Portfolio">
    <meta property="twitter:description" content="Flutter Developer Portfolio - Showcasing mobile and web projects.">
    <meta property="twitter:image" content="https://dasthashik.github.io/portfolio_ashik_das_th_2026_may/assets/assets/images/primg.jpeg">

    <title>Ashik Das T.H | Portfolio</title>
    <link rel="manifest" href="manifest.json">

    <style>
        body {
          background-color: #081b29;
          margin: 0;
          padding: 0;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          font-family: 'Poppins', sans-serif;
        }

        .loader-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 250px;
          text-align: center;
        }

        .profile-splash {
          width: 110px;
          height: 110px;
          border-radius: 50%;
          border: 3px solid #00EEFF;
          margin-bottom: 25px;
          object-fit: cover;
          box-shadow: 0 0 25px rgba(0, 238, 255, 0.4);
          animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .neon-bar {
          width: 150px;
          height: 4px;
          background: rgba(0, 238, 255, 0.1);
          border-radius: 10px;
          position: relative;
          overflow: hidden;
        }

        .neon-bar::after {
          content: '';
          position: absolute;
          left: -50%;
          width: 50%;
          height: 100%;
          background: linear-gradient(90deg, transparent, #00EEFF, transparent);
          animation: loading 1.5s infinite ease-in-out;
          box-shadow: 0 0 15px #00EEFF;
        }

        @keyframes loading {
          0% { left: -50%; }
          100% { left: 100%; }
        }

        .loading-text {
          margin-top: 15px;
          color: #00EEFF;
          font-size: 13px;
          font-weight: 500;
          letter-spacing: 4px;
          text-transform: uppercase;
          opacity: 0.7;
        }
    </style>
</head>
<body>
<div class="loader-container">
    <!-- Updated path to use Flutter's internal asset structure -->
    <img src="assets/assets/images/primg.jpeg" class="profile-splash" alt="Ashik Das T.H" onerror="this.src='assets/images/primg.jpeg'">

    <div class="neon-bar"></div>
    <div class="loading-text">Initializing</div>
</div>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
